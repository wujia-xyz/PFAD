[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfad-ultrasound"
version = "1.0.2"
description = "Privileged First-Arrival Distillation for CT-Free Bone Surface Reconstruction From Tracked Ultrasound"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<4", "Pillow>=10", "scikit-image>=0.21", "torch>=2.4,<3", "trimesh>=4,<6", "rtree>=1.2", "matplotlib>=3.8", "huggingface_hub>=0.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
geometry = ["open3d==0.19.0"]
test = ["pytest>=8"]

[project.scripts]
pfad = "pfad.core:main"

[project.urls]
Repository = "https://github.com/wujia-xyz/PFAD"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
